<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solo Maestro — витрина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<!-- Storefront integration, Уровень 2, Вариант В: the official Telegram
     WebApp SDK. Without this script, window.Telegram.WebApp (and its
     initData, which is how the CRM recognizes a partner) never exists,
     even when this page is opened via a Telegram bot's "web_app" button —
     Telegram's bridge only shows up once this SDK runs. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#eeebe6;          /* светло-серый с тёплым уклоном к золоту шапки */
  --surface:#fbfaf7;
  --surface-2:#f4f1ec;
  --line:#dcd6cc;
  --ink:#1c1a17;
  --muted:#6d675e;
  --gold:#9c7a36;        /* золото для текста на светлом */
  --gold-2:#c9a45a;
  --gold-soft:#efe4cc;
  --night:#0d0c0a;
  --partner:#24493f;     /* оптовая цена */
  --partner-soft:#e3ece8;
  --ok:#2f6b3a;
  --warn:#8a5a14;
  --danger:#9b2c24;
  --radius:14px;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.07);
  --display:"Prata",Georgia,"Times New Roman",serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
@media (min-width:700px){.wrap{padding-inline:28px}}

/* ---------- Шапка ---------- */
.hero{background:var(--night);background-image:radial-gradient(ellipse 60% 90% at 50% 55%,#2a2114 0%,var(--night) 70%);text-align:center;overflow:hidden;border-bottom:3px solid var(--gold-2)}
.hero a{display:inline-block;line-height:0}
.hero img{mix-blend-mode:lighten;height:230px;width:auto;display:block;margin:0 auto;transition:height .35s ease}
body.compact .hero img{height:120px}
@media (max-width:600px){.hero img{height:190px}body.compact .hero img{height:96px}}

/* ---------- Панель ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(251,250,247,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;padding:0 14px 0 10px;display:inline-flex;align-items:center;gap:6px;font-weight:500}
.back svg{width:18px;height:18px}
.crumbs h1{font-family:var(--display);font-weight:400;font-size:20px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px 0 38px}
.search svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}
.pill{height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.pill svg{width:18px;height:18px}
.pill.partner{background:var(--partner);color:#fff;border-color:var(--partner)}
.pill.cart{background:var(--ink);color:#fff;border-color:var(--ink)}
.count{min-width:22px;height:22px;border-radius:11px;background:var(--gold-2);color:var(--night);font-size:12px;font-weight:700;display:inline-grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
@media (max-width:600px){
  .search{order:5;max-width:none;flex-basis:100%}
  .crumbs h1{display:none}
  .pill .lbl{display:none}
  .pill{padding:0 12px}
}

.clientbanner{background:var(--gold-soft);border-bottom:1px solid #e0cfa6;font-size:14px}
.clientbanner .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:8px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px}

main{padding-block:28px 60px}

/* ---------- Главная: разделы ---------- */
.intro{max-width:640px;margin:0 auto 26px;text-align:center}
.intro h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,4vw,34px);margin:0 0 8px;text-wrap:balance}
.intro p{color:var(--muted);margin:0}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:900px){.cats{grid-template-columns:repeat(2,1fr);gap:14px}}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 16px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.cat:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--gold-2)}
.cat .ico{width:120px;height:84px;display:grid;place-items:center;border-radius:50%;}
.cat .ico svg{width:112px;height:auto;color:var(--gold)}
.cat b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.25;text-wrap:balance}
.cat small{color:var(--muted);font-size:13px}
@media (max-width:480px){.cat{padding:18px 10px 16px}.cat .ico{width:92px;height:64px}.cat .ico svg{width:88px}.cat b{font-size:16px}}

.howto{margin-top:34px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.howto div{background:var(--surface-2);border-radius:var(--radius);padding:16px 18px;font-size:14px;color:var(--muted)}
.howto div strong{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
@media (max-width:760px){.howto{grid-template-columns:1fr}}

/* ---------- Раздел ---------- */
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sechead h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,30px);margin:0}
.sechead span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.card .ph{position:relative;display:block;width:100%;border:0;padding:0;background:linear-gradient(180deg,#fff 0%,var(--surface-2) 100%);aspect-ratio:4/3;cursor:zoom-in}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .25s}
.card .ph img.alt{opacity:0}
@media (hover:hover){.card .ph:hover img.alt{opacity:1}.card .ph:hover img.main{opacity:0}}
.card .views{position:absolute;right:8px;bottom:8px;font-size:11px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.code{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.02em}
.card h3{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.card .meta{font-size:13px;color:var(--muted)}
.stock{font-size:12px;font-weight:600}
.stock.in{color:var(--ok)}.stock.order{color:var(--warn)}
.prices{margin-top:auto;padding-top:6px;display:flex;flex-direction:column;gap:1px}
.price{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.price.w{color:var(--partner)}
.price small{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-left:6px;opacity:.8}
.retail-sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.add{margin-top:8px;height:40px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:600}
.add:hover{background:#000}
.add.done{background:var(--surface);color:var(--ok);border-color:var(--ok)}
@media (max-width:520px){.card .body{padding:10px}.card h3{font-size:14px}.price{font-size:16px}.card .meta{display:none}}
.empty{padding:50px 16px;text-align:center;color:var(--muted)}

/* ---------- Просмотр товара ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,17,12,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.viewer{background:var(--surface);border-radius:18px;width:min(1040px,100%);max-height:calc(100% - 8px);overflow:auto;display:grid;grid-template-columns:1.5fr 1fr;box-shadow:0 20px 60px rgba(0,0,0,.3)}
@media (max-width:820px){.overlay{padding:0;align-items:stretch}.viewer{grid-template-columns:1fr;border-radius:0;max-height:none;height:100%}}
.stage{position:relative;background:linear-gradient(180deg,#fff,var(--surface-2));min-height:300px;overflow:hidden;touch-action:pan-y;user-select:none}
.track{display:flex;height:100%;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.slide{flex:0 0 100%;display:grid;place-items:center;padding:30px 20px 70px}
.slide img{max-width:100%;max-height:62vh;object-fit:contain;pointer-events:none}
@media (max-width:820px){.slide img{max-height:44vh}}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.95);display:grid;place-items:center}
.nav svg{width:20px;height:20px}
.nav.prev{left:12px}.nav.next{right:12px}
.tabs{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:6px}
.tabs button{border:1px solid var(--line);background:rgba(255,255,255,.95);border-radius:999px;height:32px;padding:0 12px;font-size:13px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;z-index:2}
.close svg{width:20px;height:20px}
.info{padding:26px 24px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line)}
@media (max-width:820px){.info{border-left:0;border-top:1px solid var(--line);padding:18px 16px 28px}}
.info h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.2}
.codeRow{display:flex;align-items:center;gap:8px}
.copy{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;height:28px;padding:0 10px;font-size:12px;font-weight:500}
.specs{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.specs dt{color:var(--muted)}.specs dd{margin:0;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field select,.field input,.field textarea{height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;color:var(--ink);font-size:15px}
.field textarea{height:72px;padding:10px 12px;resize:vertical}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;height:42px}
.qty button{width:38px;height:100%;border:0;background:none;font-size:18px}
.qty span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.buyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.buyrow .add{margin:0;flex:1;height:44px;min-width:160px}
.note{font-size:13px;color:var(--muted)}

/* ---------- Корзина ---------- */
.drawer{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;background:rgba(20,17,12,.45)}
.panel{background:var(--surface);width:min(460px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel header h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.panel .close{position:static}
.items{flex:1;overflow:auto;padding:6px 18px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.item img{width:64px;height:48px;object-fit:contain;background:var(--surface-2);border-radius:8px}
.item .t{font-size:14px;font-weight:600;line-height:1.3}
.item .s{font-size:12px;color:var(--muted)}
.item .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.item .qty{height:32px}.item .qty button{width:30px;font-size:16px}
.item .sum{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.rm{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
.checkout{border-top:1px solid var(--line);padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);max-height:62%;overflow:auto}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.total b{font-size:22px;font-variant-numeric:tabular-nums}
.btn{height:46px;border-radius:12px;border:1px solid transparent;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:0 16px}
.btn svg{width:20px;height:20px}
.btn.wa{background:#1f8a4c;color:#fff}
.btn.tg{background:#2a86c7;color:#fff}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clear{align-self:center;border:0;background:none;color:var(--danger);font-weight:600;font-size:14px;padding:6px}
.confirm{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;flex-wrap:wrap}
.confirm button{height:34px;border-radius:8px;padding:0 14px;border:1px solid var(--line);background:#fff;font-weight:600}
.confirm .yes{background:var(--danger);color:#fff;border-color:var(--danger)}
.err{color:var(--danger);font-size:13px}

/* ---------- Вход партнёра ---------- */
.modal{background:var(--surface);border-radius:18px;padding:24px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;position:relative}
.modal h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.modal p{margin:0;color:var(--muted);font-size:14px}
.modal .close{top:14px;right:14px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:90;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{padding-block:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="hero"><a href="#" aria-label="На главную"><img id="logo" src="logo.jpg" alt="Solo Maestro — оптическая мастерская"></a></header>

<div class="bar"><div class="wrap">
  <div class="crumbs" id="crumbs"></div>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Поиск по коду или названию" autocomplete="off"></label>
  <div class="tools">
    <button class="pill" id="who"></button>
    <button class="pill cart" id="cartBtn" aria-label="Корзина"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg><span class="lbl">Корзина</span><span class="count" id="cartCount">0</span></button>
  </div>
</div></div>
<div class="clientbanner" id="clientBanner" hidden><div class="wrap"><span>Режим показа клиенту: видны только розничные цены.</span><button class="linkbtn" id="exitClient">Выйти из режима</button></div></div>

<main class="wrap" id="app"></main>

<footer><div class="wrap"><span>Solo Maestro · оптическая мастерская · Астана</span><span id="footContacts"></span></div></footer>

<div id="layer"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* =====================================================================

const LENS = {
  clear: ["rgba(205,222,232,.35)", "rgba(205,222,232,.35)"],
  blue: ["rgba(170,200,235,.45)", "rgba(200,220,245,.35)"],

function lensPath(shape, cx, cy, flip) {
  const s = flip ? -1 : 1;
  switch (shape) {
    case "round": return `M${cx-54},${cy} a54,54 0 1,0 108,0 a54,54 0 1,0 -108,0`;
    case "oval": return `M${cx-62},${cy} a62,44 0 1,0 124,0 a62,44 0 1,0 -124,0`;
    case "rect": return rr(cx-68, cy-38, 136, 76, 16);
    case "square": return rr(cx-64, cy-50, 128, 100, 22);
    case "browline": return `M${cx-66},${cy-34} H${cx+66} Q${cx+68},${cy+22} ${cx+40},${cy+42} Q${cx},${cy+56} ${cx-40},${cy+42} Q${cx-68},${cy+22} ${cx-66},${cy-34}Z`;
    case "cateye": {
      const o = cx + s*66, i = cx - s*62;
      return `M${i},${cy-18} Q${cx},${cy-46} ${o},${cy-44} Q${o+s*2},${cy+8} ${cx+s*30},${cy+40} Q${cx-s*20},${cy+54} ${i+s*4},${cy+26} Q${i-s*4},${cy} ${i},${cy-18}Z`;
    }
    case "aviator": {
      const o = cx + s*64, i = cx - s*60;
      return `M${i},${cy-40} H${o} Q${o+s*6},${cy+20} ${cx+s*28},${cy+52} Q${cx-s*10},${cy+62} ${i+s*4},${cy+30} Q${i-s*6},${cy} ${i},${cy-40}Z`;
    }
  }
}
function rr(x, y, w, h, r) { return `M${x+r},${y} H${x+w-r} Q${x+w},${y} ${x+w},${y+r} V${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} H${x+r} Q${x},${y+h} ${x},${y+h-r} V${y+r} Q${x},${y} ${x+r},${y}Z`; }
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); let r = n>>16, g = n>>8&255, b = n&255; const f = v => Math.max(0, Math.min(255, Math.round(k>0 ? v+(255-v)*k : v*(1+k)))); return "#" + [f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join(""); };

function glassesSVG(p, view) {
  const c = p.color, sw = p.thin ? 5 : 11, rim = p.rim || c;
  const [l1, l2] = LENS[p.lens] || LENS.clear;
  const id = p.code + view;
  const defs = `<defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${l1}"/><stop offset="1" stop-color="${l2}"/></linearGradient></defs>`;
  if (view === 0) {
    const L = lensPath(p.shape, 130, 150, true), R = lensPath(p.shape, 290, 150, false);
    const top = p.shape === "browline" ? `<path d="M64,116 H196 M224,116 H356" stroke="${c}" stroke-width="16" stroke-linecap="round"/>` : "";
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300">${defs}
      <path d="${L}" fill="url(#g${id})"/><path d="${R}" fill="url(#g${id})"/>
      <path d="M92,120 Q110,110 128,118" stroke="#fff" stroke-opacity=".6" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M252,120 Q270,110 288,118" stroke="#fff" stroke-opacity=".6" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="${L}" fill="none" stroke="${rim}" stroke-width="${p.shape==='browline'?4:sw}"/><path d="${R}" fill="none" stroke="${rim}" stroke-width="${p.shape==='browline'?4:sw}"/>
      ${top}
      <path d="M190,138 Q210,122 230,138" stroke="${c}" stroke-width="${p.thin?5:9}" fill="none" stroke-linecap="round"/>
      <path d="M62,${p.shape==='aviator'?112:128} L38,122" stroke="${shade(c,-.15)}" stroke-width="${p.thin?6:12}" stroke-linecap="round"/>
      <path d="M358,${p.shape==='aviator'?112:128} L382,122" stroke="${shade(c,-.15)}" stroke-width="${p.thin?6:12}" stroke-linecap="round"/>
      <circle cx="200" cy="160" r="0" fill="none"/></svg>`;
  }
  if (view === 1) {
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300">${defs}
      <path d="M70,104 Q64,150 74,196" stroke="url(#g${id})" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M78,100 Q70,150 80,200" stroke="${rim}" stroke-width="${p.thin?6:12}" fill="none" stroke-linecap="round"/>
      <rect x="74" y="112" width="26" height="${p.thin?8:16}" rx="4" fill="${shade(c,-.2)}"/>
      <path d="M96,${p.thin?116:120} L330,132 Q362,134 372,160 Q378,180 364,196" stroke="${c}" stroke-width="${p.thin?6:12}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      ${p.thin ? `<path d="M318,131 Q360,134 372,160 Q378,180 364,196" stroke="#1d1b18" stroke-width="9" fill="none" stroke-linecap="round"/>` : ""}
      <path d="M140,118 L300,126" stroke="#fff" stroke-opacity=".35" stroke-width="2"/></svg>`;
  }
  // сверху
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300">${defs}
    <path d="M58,96 Q130,60 192,78 Q210,86 228,78 Q290,60 362,96" stroke="url(#g${id})" stroke-width="12" fill="none"/>
    <path d="M58,88 Q130,52 192,70 Q210,78 228,70 Q290,52 362,88" stroke="${rim}" stroke-width="${p.thin?7:15}" fill="none" stroke-linecap="round"/>
    <path d="M58,90 Q48,170 70,250" stroke="${c}" stroke-width="${p.thin?6:12}" fill="none" stroke-linecap="round"/>
    <path d="M362,90 Q372,170 350,250" stroke="${c}" stroke-width="${p.thin?6:12}" fill="none" stroke-linecap="round"/>
    <circle cx="192" cy="96" r="7" fill="#9aa3a8"/><circle cx="228" cy="96" r="7" fill="#9aa3a8"/></svg>`;
}
function accSVG(p, view) {
  const c = p.color, d = shade(c, -.25), l = shade(c, .35);
  let art = "";
  switch (p.kind) {
    case "case": art = view===0 ? `<rect x="60" y="100" width="300" height="110" rx="46" fill="${c}"/><path d="M62,150 H358" stroke="${l}" stroke-width="3"/><rect x="190" y="142" width="40" height="16" rx="4" fill="#c9a45a"/>`
      : view===1 ? `<ellipse cx="210" cy="155" rx="60" ry="52" fill="${c}"/><path d="M150,152 H270" stroke="${l}" stroke-width="3"/>`
      : `<rect x="60" y="110" width="300" height="80" rx="40" fill="${c}"/><rect x="80" y="126" width="260" height="48" rx="24" fill="${d}"/>`; break;
    case "cloth": art = view===2 ? `<path d="M110,90 H310 L290,210 H130Z" fill="${c}"/><path d="M110,90 L210,150 L310,90" stroke="${d}" stroke-width="3" fill="none"/>`

    case "chain": art = `<path d="M70,${view===2?150:90} Q210,${view===1?200:260} 350,${view===2?150:90}" stroke="${c}" stroke-width="5" stroke-dasharray="7 5" fill="none"/><circle cx="70" cy="${view===2?150:90}" r="10" fill="none" stroke="${d}" stroke-width="4"/><circle cx="350" cy="${view===2?150:90}" r="10" fill="none" stroke="${d}" stroke-width="4"/>`; break;
    case "spray": art = view===2 ? `<circle cx="210" cy="150" r="56" fill="${c}"/><circle cx="210" cy="150" r="24" fill="#eee"/>`
      : `<rect x="175" y="110" width="70" height="140" rx="12" fill="${c}"/><rect x="190" y="80" width="40" height="34" rx="6" fill="#e8e6e2"/><rect x="${view?226:204}" y="66" width="${view?26:12}" height="16" rx="3" fill="#bbb"/><rect x="185" y="150" width="50" height="46" rx="4" fill="#fff" opacity=".85"/>`; break;
    case "tools": art = [0,1,2].map(i => `<rect x="${110+i*70}" y="${view===2?120:90}" width="${view===1?18:26}" height="${view===2?60:90}" rx="8" fill="${c}"/><rect x="${119+i*70}" y="${view===2?180:180}" width="8" height="${view===2?20:60}" fill="#9aa3a8"/>`).join(""); break;
    case "pads": art = [0,1,2,3].map(i => `<ellipse cx="${120+i*60}" cy="150" rx="${view===1?10:20}" ry="${view===2?14:30}" fill="${c}" opacity=".85" stroke="${d}" stroke-width="2"/>`).join(""); break;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300">${art}</svg>`;
}
const imgCache = {};
function img(p, view) {
  if (p.images && p.images[view]) return p.images[view];
  const k = p.code + view;
  return imgCache[k] ||= "data:image/svg+xml;charset=utf-8," + encodeURIComponent(p.cat === "acc" ? accSVG(p, view) : glassesSVG(p, view));
}

/* ---------- Цены и режимы ---------- */
const isPartner = () => !!state.partner && !state.clientMode;
const unitPrice = p => isPartner() ? p.wholesale : p.retail;
function priceHTML(p) {
  if (isPartner()) return `<div class="price w">${fmt(p.wholesale)}<small>опт</small></div><div class="retail-sub">Розница ${fmt(p.retail)}</div>`;
  return `<div class="price">${fmt(p.retail)}</div>`;
}
function dioptersOf(p) {
  if (!p.diopters) return null;
  const a = [];
  if (p.diopters === "plus") for (let d = 1; d <= 4.001; d += .5) a.push("+" + d.toFixed(1).replace(".", ","));
  else for (let d = -1; d >= -4.001; d -= .5) a.push("−" + Math.abs(d).toFixed(1).replace(".", ","));
  return a;
}

/* ---------- Отрисовка ---------- */
const app = $("#app");
function route() { return decodeURIComponent(location.hash.replace(/^#/, "")); }

function renderBar(view) {
  const cat = CATS.find(c => c.id === view);
  const crumbs = $("#crumbs");
  if (view === "" && !state.query) crumbs.innerHTML = `<h1>Каталог</h1>`;
  else crumbs.innerHTML = `<button class="back" id="goHome">${I.back}Разделы</button>${cat ? `<h1>${esc(cat.title)}</h1>` : state.query ? `<h1>Поиск</h1>` : ""}`;
  $("#goHome")?.addEventListener("click", () => { state.query = ""; $("#q").value = ""; location.hash = ""; render(); });
  const who = $("#who");
  if (state.partner && !state.clientMode) { who.className = "pill partner"; who.innerHTML = `${I.user}<span class="lbl">${esc(state.partner.name)}</span>`; }
  else if (state.partner) { who.className = "pill"; who.innerHTML = `${I.user}<span class="lbl">Клиент</span>`; }
  else { who.className = "pill"; who.innerHTML = `${I.user}<span class="lbl">Вход для оптик</span>`; }
  $("#clientBanner").hidden = !(state.partner && state.clientMode);
  $("#cartCount").textContent = state.cart.reduce((s, i) => s + i.qty, 0);
}

function render() {
  const view = route();
  if (view.startsWith("p-")) { const p = byCode[view.slice(2)]; if (p) { renderList(p.cat); openViewer(p, 0, false); return; } }
  closeLayer(true);
  if (state.query) renderSearch();
  else if (CATS.some(c => c.id === view)) renderList(view);
  else renderHome();
}
function renderHome() {
  document.body.classList.remove("compact");
  renderBar("");
  const partnerLine = isPartner() ? "Вы вошли как партнёр: в карточках видна оптовая цена, розничная указана ниже." : "Выберите раздел. Оптики-партнёры видят оптовые цены после входа.";
  app.innerHTML = `
    <section class="intro"><h2>Витрина оптической мастерской</h2><p>${partnerLine}</p></section>
    <nav class="cats" aria-label="Разделы">
      ${CATS.map(c => `<a class="cat" href="#${c.id}" style="text-decoration:none;color:inherit"><span class="ico">${CAT_ICONS[c.id]}</span><b>${esc(c.title)}</b><small>${PRODUCTS.filter(p=>p.cat===c.id).length} моделей · ${esc(c.hint)}</small></a>`).join("")}
    </nav>
    <section class="howto">
      <div><strong>Три ракурса</strong>Нажмите на фото товара: спереди, сбоку и сверху.</div>

    </section>`;
}

function bindCards() {
  app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openProduct(byCode[b.dataset.open]));
  app.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {

}
function renderList(catId) {
  document.body.classList.add("compact");

  const cat = CATS.find(c => c.id === catId);
  const list = PRODUCTS.filter(p => p.cat === catId);

function renderSearch() {
  document.body.classList.add("compact");
  renderBar("search");

$("#q").addEventListener("input", e => { state.query = e.target.value.trim(); if (!state.query && !CATS.some(c=>c.id===route())) renderHome(); else if (!state.query) renderList(route()); else renderSearch(); });

/* ---------- Слой (просмотр/корзина/вход) ---------- */
const layer = $("#layer");
let layerFromHash = false;
function closeLayer(silent) {
  if (!layer.innerHTML) return;
  layer.innerHTML = ""; document.body.style.overflow = "";
  if (!silent && layerFromHash) { layerFromHash = false; if (history.length > 1 && route().startsWith("p-")) history.back(); else location.hash = ""; }
}
function openLayer(html) { layer.innerHTML = html; document.body.style.overflow = "hidden"; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && layer.innerHTML) closeLayer(); });

function openProduct(p) { location.hash = "p-" + p.code; }

function openViewer(p, start = 0) {
  layerFromHash = true;
  let idx = start, qty = 1;
  const views = ["Спереди", "Сбоку", "Сверху"];
  const dio = dioptersOf(p);
  const specs = [
    ["Размер", p.size], ["Материал", p.material], ["Для кого", p.sex], ["Линзы", p.uv],
    ["Наличие", p.stock === "in" ? "В наличии" : "Под заказ, 3–5 дней"],
  ].filter(r => r[1]);
  openLayer(`<div class="overlay" data-bg>
    <div class="viewer" role="dialog" aria-modal="true" aria-label="${esc(p.name)}">
      <div class="stage">
        <button class="close" data-close aria-label="Закрыть">${I.x}</button>
        <div class="track">${views.map((v,i)=>`<div class="slide"><img src="${img(p,i)}" alt="${esc(p.name)}, вид ${v.toLowerCase()}"></div>`).join("")}</div>
        <button class="nav prev" aria-label="Предыдущий ракурс">${I.back}</button>
        <button class="nav next" aria-label="Следующий ракурс">${I.next}</button>
        <div class="tabs" role="tablist">${views.map((v,i)=>`<button role="tab" data-i="${i}">${v}</button>`).join("")}</div>
      </div>
      <div class="info">
        <div class="codeRow"><span class="code">${p.code}</span><button class="copy" data-copy="${p.code}">Скопировать код</button></div>
        <h2>${esc(p.name)}</h2>
        <dl class="specs">${specs.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
        <div class="prices">${priceHTML(p)}</div>
        ${dio ? `<label class="field">Диоптрия<select id="dio">${dio.map(d=>`<option>${d}</option>`).join("")}</select></label>` : ""}
        <div class="buyrow"><div class="qty"><button data-q="-1" aria-label="Меньше">−</button><span id="vq">1</span><button data-q="1" aria-label="Больше">+</button></div><button class="add" id="vadd">Добавить в корзину</button></div>
        <p class="note">Размер указан как ширина линзы □ мост — длина заушника, мм.</p>
      </div>
    </div></div>`);
  const track = $(".track", layer), tabs = [...layer.querySelectorAll(".tabs button")];
  const go = i => { idx = (i + 3) % 3; track.style.transform = `translateX(${-idx*100}%)`; tabs.forEach((t,k)=>t.setAttribute("aria-selected", k===idx)); };
  go(idx);
  $(".prev", layer).onclick = () => go(idx - 1);
  $(".next", layer).onclick = () => go(idx + 1);
  tabs.forEach(t => t.onclick = () => go(+t.dataset.i));
  // свайп
  const stage = $(".stage", layer); let x0 = null;
  stage.addEventListener("pointerdown", e => { if (e.target.closest("button")) return; x0 = e.clientX; });
  stage.addEventListener("pointerup", e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1)); });
  layer.onkeydown = null;
  document.onkeydown = e => { if (!$(".viewer", layer)) return; if (e.key === "ArrowRight") go(idx+1); if (e.key === "ArrowLeft") go(idx-1); };

/* ---------- Корзина ---------- */
function saveCart() { store.set("cart", state.cart); renderBar(route()); }
function addToCart(p, opt, qty) {
  const it = state.cart.find(i => i.code === p.code && i.opt === opt);
  if (it) it.qty += qty; else state.cart.push({ code: p.code, opt, qty });
  saveCart(); toast(`«${p.name}» ${opt ? "(" + opt + ") " : ""}в корзине`);
  const v = route(); if (!v.startsWith("p-")) render(); else if (byCode[v.slice(2)]) renderList(byCode[v.slice(2)].cat);
}
const cartLines = () => state.cart.filter(i => byCode[i.code]).map(i => ({ ...i, p: byCode[i.code] }));
const cartTotal = () => cartLines().reduce((s, l) => s + unitPrice(l.p) * l.qty, 0);

let clearAsk = false;
function openCart() {
  const lines = cartLines();
  const partner = isPartner(), client = state.partner && state.clientMode;
  const form = client ? `<p class="note">Покажите выбор консультанту: оптика оформит заказ и сообщит о готовности.</p><button class="btn dark" data-close>Готово</button>`
    : partner ? `
      <label class="field">Комментарий к заказу (необязательно)<textarea id="cNote" placeholder="Например: под заказ клиента Иванова, линзы 1.6 AR"></textarea></label>

      <label class="field">Ваше имя<input id="cName" autocomplete="name" value="${esc(store.get("name",""))}"></label>
      <label class="field">Телефон<input id="cPhone" type="tel" autocomplete="tel" placeholder="+7 7__ ___ __ __" value="${esc(store.get("phone",""))}"></label>

  openLayer(`<div class="drawer" data-bg><aside class="panel" role="dialog" aria-modal="true" aria-label="Корзина">
    <header><h2>Корзина</h2><button class="close" data-close aria-label="Закрыть">${I.x}</button></header>
    <div class="items">${lines.length ? lines.map((l, n) => `
      <div class="item"><img src="${img(l.p,0)}" alt="">
        <div><div class="code">${l.p.code}</div><div class="t">${esc(l.p.name)}</div><div class="s">${l.opt ? "Диоптрия " + l.opt + " · " : ""}${fmt(unitPrice(l.p))}${partner ? " опт" : ""}</div></div>
        <div class="r"><div class="qty"><button data-cq="${n}" data-d="-1" aria-label="Меньше">−</button><span>${l.qty}</span><button data-cq="${n}" data-d="1" aria-label="Больше">+</button></div><span class="sum">${fmt(unitPrice(l.p)*l.qty)}</span><button class="rm" data-rm="${n}">Убрать</button></div>
      </div>`).join("") : `<div class="empty">Корзина пуста.<br>Откройте раздел и добавьте модели.</div>`}</div>
    ${lines.length ? `<div class="checkout">
      <div class="total"><span>Итого${partner ? " по оптовым ценам" : ""}</span><b>${fmt(cartTotal())}</b></div>
      ${form}
      <div id="clearBox">${clearAsk ? `<div class="confirm"><span>Удалить все товары?</span><button class="yes" id="clearYes">Очистить</button><button id="clearNo">Отмена</button></div>` : `<button class="clear" id="clearAsk" style="width:100%">Очистить корзину</button>`}</div>
    </div>` : ""}
  </aside></div>`);
  layerFromHash = false;
  const lns = lines;
  layer.querySelectorAll("[data-cq]").forEach(b => b.onclick = () => { const l = lns[+b.dataset.cq]; const it = state.cart.find(i => i.code === l.code && i.opt === l.opt); it.qty = Math.max(1, it.qty + +b.dataset.d); saveCart(); keep(); });
  layer.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { const l = lns[+b.dataset.rm]; state.cart = state.cart.filter(i => !(i.code === l.code && i.opt === l.opt)); saveCart(); keep(); refreshList(); });
  layer.querySelectorAll("[data-close]").forEach(b => b.onclick = () => closeLayer());
  $("[data-bg]", layer).onclick = e => { if (e.target.hasAttribute("data-bg")) closeLayer(); };
  $("#clearAsk", layer)?.addEventListener("click", () => { clearAsk = true; keep(); });
  $("#clearNo", layer)?.addEventListener("click", () => { clearAsk = false; keep(); });
  $("#clearYes", layer)?.addEventListener("click", () => { clearAsk = false; state.cart = []; saveCart(); keep(); refreshList(); toast("Корзина очищена"); });

  const note = () => $("#cNote", layer)?.value.trim() || "";
  const wa = $("#sendWa", layer), tgl = $("#sendTgLink", layer);
  const updLinks = () => {
    const t = orderText(note());
    if (wa) wa.href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(t)}`;
    if (tgl) tgl.href = `https://t.me/${CONFIG.telegram}?text=${encodeURIComponent(t)}`;
  };
  layer.querySelectorAll("#cNote,#cName,#cPhone").forEach(el => el.addEventListener("input", () => { store.set("name", $("#cName",layer)?.value||""); store.set("phone", $("#cPhone",layer)?.value||""); updLinks(); }));
  updLinks();
  const guard = e => {
    if (partner) return true;
    const ok = ($("#cName",layer).value.trim() && $("#cPhone",layer).value.replace(/\D/g,"").length >= 10);
    $("#cErr",layer).hidden = !!ok;
    if (!ok) { e.preventDefault(); return false; }
    copyText(orderText(note()), null);
    toast("Откроется чат с готовым текстом заявки. Нажмите «Отправить».");
    return true;
  };
  wa?.addEventListener("click", e => { if (partner) { copyText(orderText(note()), null); toast("Откроется WhatsApp с текстом заявки. Нажмите «Отправить»."); } else guard(e); });
  tgl?.addEventListener("click", guard);
  $("#copyOrder", layer)?.addEventListener("click", () => copyText(orderText(note()), "Текст заявки скопирован"));
  // Storefront integration, Уровень 2, Вариант В: the partner's primary
  // checkout action now creates a real CRM order (POST /api/storefront/
  // orders, bearer-authenticated) instead of only producing a message for
  // someone to retype into the CRM by hand. WhatsApp/copy-text above stay
  // as an extra heads-up channel, not the order record itself.
  $("#sendCrm", layer)?.addEventListener("click", async e => {
    const btn = e.currentTarget;
    const errEl = $("#crmErr", layer);
    if (errEl) errEl.hidden = true;

      if (errEl) { errEl.hidden = false; errEl.textContent = "Витрина ещё не подключена к CRM — используйте WhatsApp ниже."; }

      const items = cartLines().map(l => ({
        code: l.p.code,
        name: l.p.name,
        cat: l.p.cat,
        ...(l.opt ? { opt: l.opt } : {}),
        qty: l.qty,
        unitPrice: unitPrice(l.p),
      }));
      const res = await fetch(CONFIG.crmApiUrl.replace(/\/$/, "") + "/api/storefront/orders", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + state.partnerToken },
        body: JSON.stringify({ items, note: note() }),
      });
      if (!res.ok) throw new Error("request failed: " + res.status);
      const data = await res.json();
      state.cart = []; saveCart(); closeLayer(); refreshList();
      toast(`Заказ №${data.order.orderNumber} оформлен в CRM`);
    } catch (err) {
      btn.disabled = false; btn.textContent = "Оформить заказ в CRM";
      if (errEl) { errEl.hidden = false; errEl.textContent = "Не получилось отправить — проверьте связь и попробуйте ещё раз, либо напишите в WhatsApp ниже."; }
    }
  });
  function keep() { const n = $("#cNote", layer)?.value; openCart(); if (n && $("#cNote", layer)) $("#cNote", layer).value = n; }
}
function refreshList() { const v = route(); if (state.query) renderSearch(); else if (CATS.some(c=>c.id===v)) renderList(v); }
function orderText(note) {
  const partner = isPartner();
  const L = cartLines();
  const head = partner ? `ЗАЯВКА ПАРТНЁРА (опт)\nОптика: ${state.partner.name}` : `ЗАКАЗ С ВИТРИНЫ (розница)\nИмя: ${$("#cName")?.value.trim() || "—"}\nТелефон: ${$("#cPhone")?.value.trim() || "—"}`;
  const rows = L.map((l, i) => `${i+1}. ${l.p.code} ${l.p.name}${l.opt ? ", диоптрия " + l.opt : ""} — ${l.qty} шт × ${fmt(unitPrice(l.p))} = ${fmt(unitPrice(l.p)*l.qty)}`);
  return `Solo Maestro · ${head}\n\n${rows.join("\n")}\n\nИтого: ${fmt(cartTotal())}${note ? "\nКомментарий: " + note : ""}`;
}

/* ---------- Партнёр: вход через Telegram, выход из режима клиента ----------
   Storefront integration, Уровень 2, Вариант В — заменяет прежний вход по
   общему коду (CONFIG.partners/openLogin()). Партнёр не логинится вручную
   на этой странице вообще: его узнают по тому же Telegram-аккаунту, что и
   в самой CRM, как только он открывает витрину из бота (initPartnerSession()

function openAccount() {
  openLayer(`<div class="overlay" data-bg><div class="modal">

/* ---------- Вход партнёра через Telegram ----------
   Storefront integration, Уровень 2, Вариант В. Runs once on load, before
   the first render(): if this page was opened from the bot's "Открыть
   витрину" button (see bot/handlers/start.ts in the CRM repo), the
   Telegram WebApp SDK (loaded in <head>) exposes window.Telegram.WebApp
   with a signed initData string — the same kind of proof the CRM itself
   already uses to log staff and partners in. Posting it to the CRM's
   /api/storefront/auth is how this separate, static page gets to ask
   "is this Telegram account an approved partner?" without ever holding a
   password or shared code of its own. */
async function initPartnerSession() {
  // A partner cached from the old shared-code login (before this change)
  // has no token and can't be trusted for checkout — drop it rather than
  // show wholesale prices no one can actually act on.
  if (state.partner && !state.partnerToken) {
    state.partner = null; state.clientMode = false;
    store.set("partner", null); store.set("clientMode", false); store.set("partnerToken", null);
  }

  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg || !tg.initData) return; // opened in an ordinary browser — guest/retail mode, unchanged

  try { tg.ready(); tg.expand(); } catch {}

  if (!CONFIG.crmApiUrl) return; // CRM URL not filled in yet — see CONFIG comment

  try {
    const res = await fetch(CONFIG.crmApiUrl.replace(/\/$/, "") + "/api/storefront/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: tg.initData }),
    });
    if (!res.ok) {
      // Not an approved partner's Telegram account (not linked at all,
      // or still awaiting the optic's approval) — fail safe to
      // guest/retail, exactly as if opened outside Telegram entirely.
      state.partner = null; state.partnerToken = null; state.clientMode = false;
      store.set("partner", null); store.set("partnerToken", null); store.set("clientMode", false);
      return;
    }
    const data = await res.json();
    const partnerName = data.partner.opticName
      || [data.partner.firstName, data.partner.lastName].filter(Boolean).join(" ")
      || "Партнёр";
    state.partner = { id: data.partner.id, name: partnerName };
    state.partnerToken = data.token;
    store.set("partner", state.partner);
    store.set("partnerToken", state.partnerToken);
  } catch (err) {
    // Network error reaching the CRM — never leave wholesale pricing on
    // screen backed by a session that couldn't actually be verified.
    state.partner = null; state.partnerToken = null; state.clientMode = false;
  }
}

/* ---------- Мелочи ---------- */
let tt;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3200); }
function copyText(text, msg) {
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch {} ta.remove(); if (msg) toast(msg); };
  try { navigator.clipboard.writeText(text).then(() => msg && toast(msg), fallback); } catch { fallback(); }
}
